name: Sanity Check
on: push

jobs:
  run:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7.0.0
      with:
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: 3.14

    - name: Set up uv
      uses: astral-sh/setup-uv@v7.0.0
      with:
        version: latest

    - name: Install dependencies
      run: make deps

    - name: Lint with Ruff and MyPy
      run: make lint

    - name: Run build to make sure it works
      run: make build
